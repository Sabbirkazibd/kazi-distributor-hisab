<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><link rel="manifest" href="manifest.json"><title>Kazi Distributor Hisab</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f6f5;margin:0;color:#17312d}header{background:#075e54;color:white;padding:16px}main{padding:12px;max-width:800px;margin:auto}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:0;border-radius:8px;background:#087e70;color:white;padding:11px;margin:3px}input,select{box-sizing:border-box;width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ccd8d5;border-radius:8px}.card{background:white;border-radius:12px;padding:14px;margin:12px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#e1f2ec;padding:12px;border-radius:9px}.item{padding:9px 0;border-bottom:1px solid #eee}.danger{background:#bd3030}.line{border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0}
</style></head><body><header><h2>Kazi Distributor Hisab</h2><small>দোকান, বিল, আদায় ও বাকি হিসাব</small></header><main>
<nav><button onclick="show('home')">হোম</button><button onclick="show('shops')">দোকান</button><button onclick="show('bills')">বিল</button><button onclick="show('payments')">আদায়</button><button onclick="show('expenses')">খরচ</button><button onclick="show('stock')">স্টক</button><button onclick="show('returns')">ফেরত</button><button onclick="show('reports')">রিপোর্ট</button><button onclick="show('backup')">ব্যাকআপ</button></nav>
<section id="home"><div class="grid"><div class="stat">মোট বিক্রি<h3 id="sales">৳০</h3></div><div class="stat">মোট আদায়<h3 id="paid">৳০</h3></div><div class="stat">মোট বাকি<h3 id="due">৳০</h3></div><div class="stat">মোট খরচ<h3 id="expenseTotal">৳০</h3></div></div><div class="card"><h3>সাম্প্রতিক বিল</h3><div id="recent"></div></div></section>
<section id="shops" class="hidden"><div class="card"><h3>দোকান যোগ</h3><input id="shopName" placeholder="দোকানের নাম"><input id="shopPhone" placeholder="মোবাইল (ঐচ্ছিক)"><button onclick="addShop()">সেভ</button></div><div class="card"><h3>দোকানের তালিকা</h3><input id="shopSearch" placeholder="দোকান খুঁজুন" oninput="render()"><div id="shopsList"></div></div></section>
<section id="bills" class="hidden"><div class="card"><h3>নতুন বিল</h3><input id="billShop" list="shopNames" placeholder="দোকানের নাম"><datalist id="shopNames"></datalist><label>তারিখ</label><input id="billDate" type="date"><div id="lines"></div><button onclick="addLine()">+ পণ্য যোগ</button><p>মোট: <b id="billTotal">৳০</b></p><label>এখন জমা</label><input id="initialPaid" type="number" min="0" value="0"><button onclick="addBill()">বিল সেভ</button></div><div class="card"><h3>বিলের তালিকা</h3><div id="billList"></div></div></section>
<section id="payments" class="hidden"><div class="card"><h3>টাকা আদায়</h3><select id="paymentBill"></select><div id="selectedDue"></div><input id="paymentAmount" type="number" min="1" placeholder="টাকার পরিমাণ"><input id="paymentDate" type="date"><button onclick="addPayment()">আদায় সেভ</button></div><div class="card" id="paymentList"></div></section>
<section id="expenses" class="hidden"><div class="card"><h3>খরচ যোগ</h3><select id="expenseType"><option>খাজনা</option><option>নাস্তা</option><option>লেবার</option><option>গাড়ি ভাড়া</option><option>তেল/জ্বালানি</option><option>অন্যান্য</option></select><input id="expenseAmount" type="number" min="1" placeholder="টাকার পরিমাণ"><input id="expenseNote" placeholder="বিবরণ"><input id="expenseDate" type="date"><button onclick="addExpense()">খরচ সেভ</button></div><div class="card" id="expenseList"></div></section>
<section id="stock" class="hidden"><div class="card"><h3>স্টকে মাল উঠান</h3><select id="stockProduct"></select><input id="stockQty" type="number" min="1" placeholder="পরিমাণ"><button onclick="addStock()">স্টক সেভ</button></div><div class="card" id="stockList"></div></section>
<section id="returns" class="hidden"><div class="card"><h3>মাল ফেরত</h3><select id="returnBill"></select><select id="returnProduct"></select><input id="returnQty" type="number" min="1" placeholder="পরিমাণ"><button onclick="addReturn()">ফেরত সেভ</button></div><div class="card" id="returnList"></div></section>
<section id="reports" class="hidden"><div class="card"><h3>রিপোর্ট</h3><div id="report"></div><h4>দোকানভিত্তিক বাকি</h4><div id="balances"></div></div></section>
<section id="backup" class="hidden"><div class="card"><h3>ব্যাকআপ</h3><button onclick="backup()">JSON ব্যাকআপ ডাউনলোড</button><input id="restoreFile" type="file" accept=".json"><button onclick="restore()">ব্যাকআপ ফিরিয়ে আনুন</button></div><div class="card"><h3>সব হিসাব মুছুন</h3><button class="danger" onclick="resetAll()">সব ডেটা রিসেট</button></div></section>
</main><script>
const $=id=>document.getElementById(id),fmt=n=>'৳'+Number(n||0).toLocaleString('en-IN'),date=()=>new Date().toLocaleDateString('en-CA');
const products=[['5 লিটার',950],['3 লিটার',580],['2 লিটার',388],['1 লিটার',194],['500 ml',97],['900 ml',175],['1800 ml',350]];
let db={shops:[],bills:[],payments:[],expenses:[],stock:[],returns:[]};try{db={...db,...JSON.parse(localStorage.getItem('kaziHisabData')||'{}')}}catch(e){}
function save(){localStorage.setItem('kaziHisabData',JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');render()}
function total(b){return b.lines.reduce((s,l)=>s+l.qty*l.rate,0)}
function paidBill(b){return (b.initial||0)+db.payments.filter(p=>p.bill===b.id).reduce((s,p)=>s+p.amount,0)}
function returnedBill(b){return db.returns.filter(r=>r.bill===b.id).reduce((s,r)=>s+r.amount,0)}
function dueBill(b){return Math.max(0,total(b)-paidBill(b)-returnedBill(b))}
function shopDue(n){return db.bills.filter(b=>b.shop===n).reduce((s,b)=>s+dueBill(b),0)}
function addShop(){let n=$('shopName').value.trim();if(!n)return alert('দোকানের নাম দিন');if(db.shops.some(x=>x.name.toLowerCase()===n.toLowerCase()))return alert('দোকান আগে আছে');db.shops.push({name:n,phone:$('shopPhone').value});$('shopName').value='';$('shopPhone').value='';save()}
function addLine(){let d=document.createElement('div');d.className='line';d.innerHTML='<select class="p">'+products.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('')+'</select><input class="q" type="number" min="1" value="1"><input class="r" type="number" min="0" value="950"><button onclick="customRate(this)">দাম বদল</button><button class="danger" onclick="this.parentElement.remove();calc()">বাদ</button>';d.querySelector('.p').onchange=()=>{d.querySelector('.r').value=products[+d.querySelector('.p').value][1];calc()};d.querySelector('.q').oninput=d.querySelector('.r').oninput=calc;$('lines').appendChild(d);calc()}
function customRate(b){let v=prompt('প্রতি পিস দাম লিখুন');if(v!==null&&+v>=0){b.parentElement.querySelector('.r').value=+v;calc()}}
function calc(){let t=0;document.querySelectorAll('.line').forEach(d=>t+=(+d.querySelector('.q').value||0)*(+d.querySelector('.r').value||0));$('billTotal').textContent=fmt(t);return t}
function addBill(){let shop=$('billShop').value.trim(),ls=[...document.querySelectorAll('.line')].map(d=>({product:products[+d.querySelector('.p').value][0],qty:+d.querySelector('.q').value,rate:+d.querySelector('.r').value})),initial=+$('initialPaid').value||0,t=ls.reduce((s,l)=>s+l.qty*l.rate,0);if(!shop||!ls.length||ls.some(l=>l.qty<1||l.rate<0)||initial<0||initial>t)return alert('দোকান, পণ্য ও জমার তথ্য ঠিক করুন');if(!db.shops.some(s=>s.name.toLowerCase()===shop.toLowerCase()))db.shops.push({name:shop,phone:''});db.bills.unshift({id:Date.now(),shop,date:$('billDate').value||date(),lines:ls,initial});$('billShop').value='';$('initialPaid').value=0;$('lines').innerHTML='';addLine();save();alert('বিল সেভ হয়েছে')}
function addPayment(){let b=db.bills.find(x=>x.id===+$('paymentBill').value),a=+$('paymentAmount').value;if(!b||a<=0||a>dueBill(b))return alert('বিল ও সঠিক টাকা দিন');db.payments.unshift({bill:b.id,amount:a,date:$('paymentDate').value||date()});$('paymentAmount').value='';save();alert('আদায় সেভ হয়েছে')}
function addExpense(){let a=+$('expenseAmount').value;if(a<=0)return alert('টাকা লিখুন');db.expenses.unshift({type:$('expenseType').value,amount:a,note:$('expenseNote').value,date:$('expenseDate').value||date()});$('expenseAmount').value='';$('expenseNote').value='';save()}
function sold(n){return db.bills.reduce((s,b)=>s+b.lines.filter(l=>l.product===n).reduce((a,l)=>a+l.qty,0),0)}
function stock(n){return db.stock.filter(x=>x.product===n).reduce((s,x)=>s+x.qty,0)-sold(n)+db.returns.filter(x=>x.product===n).reduce((s,x)=>s+x.qty,0)}
function addStock(){let p=products[+$('stockProduct').value][0],q=+$('stockQty').value;if(q<=0)return alert('পরিমাণ দিন');db.stock.unshift({product:p,qty:q});$('stockQty').value='';save()}
function addReturn(){let b=db.bills.find(x=>x.id===+$('returnBill').value),i=+$('returnProduct').value,q=+$('returnQty').value,l=b?.lines[i];if(!l||q<=0)return alert('বিল ও পরিমাণ দিন');let used=db.returns.filter(x=>x.bill===b.id&&x.index===i).reduce((s,x)=>s+x.qty,0);if(q>l.qty-used)return alert('বিলের পরিমাণ ছাড়িয়েছে');db.returns.unshift({bill:b.id,index:i,product:l.product,qty:q,amount:q*l.rate});$('returnQty').value='';save()}
function render(){let sales=db.bills.reduce((s,b)=>s+total(b)-returnedBill(b),0),paid=db.bills.reduce((s,b)=>s+paidBill(b),0),due=db.bills.reduce((s,b)=>s+dueBill(b),0),ex=db.expenses.reduce((s,x)=>s+x.amount,0);$('sales').textContent=fmt(sales);$('paid').textContent=fmt(paid);$('due').textContent=fmt(due);$('expenseTotal').textContent=fmt(ex);$('shopNames').innerHTML=db.shops.map(s=>`<option value="${esc(s.name)}">`).join('');$('shopsList').innerHTML=db.shops.filter(s=>s.name.toLowerCase().includes(($('shopSearch').value||'').toLowerCase())).map(s=>`<div class="item">${esc(s.name)} — বাকি ${fmt(shopDue(s.name))}</div>`).join('')||'দোকান নেই';$('billList').innerHTML=db.bills.map(b=>`<div class="item"><b>${esc(b.shop)}</b> ${b.date}<br>মোট ${fmt(total(b))} • আদায় ${fmt(paidBill(b))} • বাকি ${fmt(dueBill(b))}</div>`).join('')||'বিল নেই';$('recent').innerHTML=db.bills.slice(0,5).map(b=>`<div class="item">${esc(b.shop)} — ${fmt(total(b))} — বাকি ${fmt(dueBill(b))}</div>`).join('')||'বিল নেই';$('paymentBill').innerHTML=db.bills.filter(b=>dueBill(b)>0).map(b=>`<option value="${b.id}">${esc(b.shop)} — বাকি ${fmt(dueBill(b))}</option>`).join('');$('selectedDue').textContent=$('paymentBill').value?`বাকি ${fmt(dueBill(db.bills.find(b=>b.id===+$('paymentBill').value)))}`:'';$('paymentList').innerHTML=db.payments.map(p=>`<div class="item">${fmt(p.amount)} — ${p.date}</div>`).join('')||'আদায় নেই';$('expenseList').innerHTML=db.expenses.map(x=>`<div class="item">${esc(x.type)} ${fmt(x.amount)} — ${x.date} ${esc(x.note)}</div>`).join('')||'খরচ নেই';$('stockProduct').innerHTML=products.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('');$('stockList').innerHTML=products.map(p=>`<div class="item">${p[0]} — ${stock(p[0])} পিস</div>`).join('');$('returnBill').innerHTML=db.bills.map(b=>`<option value="${b.id}">${esc(b.shop)} ${b.date}</option>`).join('');renderReturnProducts();$('returnList').innerHTML=db.returns.map(r=>`<div class="item">${r.product} ${r.qty} পিস ${fmt(r.amount)}</div>`).join('')||'ফেরত নেই';$('report').innerHTML=`বিক্রি ${fmt(sales)}<br>আদায় ${fmt(paid)}<br>বাকি ${fmt(due)}<br>খরচ ${fmt(ex)}`;$('balances').innerHTML=db.shops.map(s=>`<div class="item">${esc(s.name)} — ${fmt(shopDue(s.name))}</div>`).join('')}
function renderReturnProducts(){let b=db.bills.find(x=>x.id===+$('returnBill').value);$('returnProduct').innerHTML=b?b.lines.map((l,i)=>`<option value="${i}">${esc(l.product)} (${l.qty})</option>`).join(''):''}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=u;a.download='kazi-hisab-backup.json';a.click();URL.revokeObjectURL(u)}
function restore(){let f=$('restoreFile').files[0];if(!f)return alert('ফাইল নির্বাচন করুন');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);['shops','bills','payments','expenses','stock','returns'].forEach(k=>{if(!Array.isArray(d[k]))throw 0});if(confirm('বর্তমান ডেটা বদলে ব্যাকআপ আনবেন?')){db=d;save()}}catch(e){alert('ভুল ব্যাকআপ ফাইল')}};r.readAsText(f)}
function resetAll(){if(confirm('সব হিসাব মুছবেন?')&&confirm('শেষবার নিশ্চিত করুন')){db={shops:[],bills:[],payments:[],expenses:[],stock:[],returns:[]};save()}}
['billDate','paymentDate','expenseDate'].forEach(id=>$(id).value=date());addLine();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
